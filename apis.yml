name: Vamo
description: Vamo was a San Francisco travel startup offering multi-city trip planning
  that automatically found the best combination of open-jaw flights, low-cost carriers,
  trains, buses, ferries, and hotels for international itineraries. Backed by DCVC and
  Slow Ventures, the team joined Airbnb on September 11, 2015 and the product was shut
  down, so no API surface exists; vamo.com is now parked at MarkMonitor.
